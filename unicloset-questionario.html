<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>unicloset — questionário</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #F0EDE6;
    --card: #FFFFFF;
    --block: #E4DCD1;
    --sage: #8A9A80;
    --terracotta: #C97B5A;
    --terracotta-light: #D9A98A;
    --ink: #3A362F;
    --black: #000000;
    --muted: #8A8478;
    --outer: #2A2823;
  }
  *{ box-sizing: border-box; }
  html, body{ height: 100%; }
  body{
    margin: 0;
    background: var(--outer);
    font-family: 'Montserrat', sans-serif;
    color: var(--black);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px 12px;
  }

  .phone{
    width: 100%;
    max-width: 420px;
    height: min(760px, 92vh);
    background: var(--bg);
    border-radius: 26px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.45);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* Header */
  .chat-header{
    background: var(--card);
    padding: 16px 18px;
    display: flex;
    align-items: center;
    gap: 12px;
    border-bottom: 1px solid rgba(58,54,47,0.08);
    flex-shrink: 0;
  }
  .avatar{
    width: 42px;
    height: 42px;
    border-radius: 50%;
    background: var(--bg);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
  }
  .avatar img{
    width: 100%;
    height: 100%;
    object-fit: cover;
  }
  .chat-header .who{ flex: 1; }
  .chat-header .name{
    font-weight: 700;
    font-size: 15px;
  }
  .chat-header .status{
    font-size: 11.5px;
    color: var(--muted);
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .chat-header .status .dot{
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: #6FB56A;
  }

  /* Message area */
  .chat-body{
    flex: 1;
    overflow-y: auto;
    padding: 18px 16px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }
  .msg{
    max-width: 82%;
    padding: 12px 14px;
    border-radius: 16px;
    font-size: 13.5px;
    line-height: 1.5;
    animation: pop .25s ease;
  }
  @keyframes pop{
    from{ opacity: 0; transform: translateY(6px); }
    to{ opacity: 1; transform: translateY(0); }
  }
  .msg.bot{
    align-self: flex-start;
    background: var(--card);
    border-bottom-left-radius: 4px;
    color: var(--black);
  }
  .msg.user{
    align-self: flex-end;
    background: var(--ink);
    color: var(--bg);
    border-bottom-right-radius: 4px;
  }

  .label{
    align-self: center;
    font-size: 10.5px;
    font-weight: 600;
    letter-spacing: 0.8px;
    text-transform: uppercase;
    color: var(--muted);
    margin: 4px 0 -2px;
  }

  .options{
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  button.opt{
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    background: var(--card);
    border: 1px solid rgba(58,54,47,0.1);
    border-radius: 999px;
    padding: 12px 16px;
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 600;
    color: var(--black);
    cursor: pointer;
    text-align: left;
    box-shadow: 0 2px 8px rgba(58,54,47,0.06);
    animation: pop .25s ease;
  }
  button.opt:hover{ background: var(--block); }
  button.opt .chev{
    color: var(--muted);
    flex-shrink: 0;
  }

  /* Result card */
  .result-card{
    background: var(--ink);
    color: var(--bg);
    border-radius: 16px;
    padding: 18px;
    animation: pop .3s ease;
  }
  .result-card .eyebrow{
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 1px;
    text-transform: uppercase;
    opacity: 0.75;
    margin-bottom: 8px;
  }
  .result-card .title{
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .result-card .desc{
    font-size: 12.5px;
    line-height: 1.55;
    color: rgba(240,237,230,0.78);
    margin-bottom: 16px;
  }
  a.result-cta{
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: rgba(240,237,230,0.14);
    color: var(--bg);
    text-decoration: none;
    border-radius: 999px;
    padding: 12px 16px;
    font-size: 13px;
    font-weight: 700;
  }

  /* Footer input (decorative) */
  .chat-footer{
    background: var(--card);
    padding: 12px 14px;
    border-top: 1px solid rgba(58,54,47,0.08);
    display: flex;
    align-items: center;
    gap: 10px;
    flex-shrink: 0;
  }
  .chat-footer .fake-input{
    flex: 1;
    background: var(--bg);
    border-radius: 999px;
    padding: 11px 16px;
    font-size: 13px;
    color: var(--muted);
  }
  .chat-footer .send{
    width: 38px;
    height: 38px;
    border-radius: 50%;
    background: var(--ink);
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--bg);
    flex-shrink: 0;
  }
  .chat-footer .send svg{ width: 16px; height: 16px; }

  .restart-btn{
    align-self: center;
    margin-top: 4px;
    background: none;
    border: none;
    font-family: inherit;
    font-size: 12px;
    font-weight: 600;
    color: var(--muted);
    cursor: pointer;
    padding: 8px 12px;
    animation: pop .3s ease;
  }
  .restart-btn:hover{ color: var(--ink); }

  .chat-body::-webkit-scrollbar{ width: 4px; }
  .chat-body::-webkit-scrollbar-thumb{ background: rgba(58,54,47,0.2); border-radius: 4px; }
</style>
</head>

<script>
  const chatBody = document.getElementById('chatBody');

  // ---- Quiz content — edite os textos aqui ----
  // Todo mundo responde as 3 perguntas. Cada opção pontua 1 ou mais linhas via "tags"

  const Q1 = {
    text: "O que você mais busca no seu guarda-roupa agora?",
    options: [
      { label: "Roupas para rotina e trabalho, no dia a dia", tags: ["classicos"] },
      { label: "Tenho uma festa ou casamento chegando", tags: ["festa"] },
      { label: "Quero trazer mais personalidade para meus looks", tags: ["atelie"] },
      { label: "Deixar meus looks mais interessantes com acessórios", tags: ["acessorios"] },
    ]
  };

  const Q2 = {
    text: "Como você descreveria seu estilo hoje?",
    options: [
      { label: "Cores neutras e peças lisas", tags: ["classicos"] },
      { label: "Personalidade, estampas e texturas", tags: ["atelie"] },
      { label: "Majoritariamente básico, mas com pontos interessantes", tags: ["acessorios"] },
    ]
  };

  const Q3 = {
    text: "O que mais te incomoda no seu armário hoje?",
    options: [
      { label: "Tenho muitas peças que não combinam entre si", tags: ["classicos"] },
      { label: "Preciso de peças para ocasiões especiais", tags: ["festa", "atelie"] },
      { label: "Os looks sempre ficam parecidos ou sem um toque final", tags: ["acessorios", "atelie"] },
    ]
  };

  // Exceções: quando essa combinação exata de pergunta 2 + pergunta 3 acontece,
  // o resultado é sempre o indicado aqui, não importa a pontuação (nem a resposta da pergunta 1).
  const OVERRIDES = [
    { q2: "Cores neutras e peças lisas", q3: "Os looks sempre ficam parecidos ou sem um toque final", result: "classicos" },
    { q2: "Majoritariamente básico, mas com pontos interessantes", q3: "Os looks sempre ficam parecidos ou sem um toque final", result: "atelie" },
  ];

  const RESULTS = {
    classicos: {
      eyebrow: "sua linha é",
      title: "Clássicos",
      desc: "\"vista-se bem sem pensar demais\" — peças neutras, fáceis de combinar e duráveis, pra facilitar seu dia a dia.",
      url: "https://unicloset.com.br/categoria-de-produto/classicos/"
    },
    festa: {
      eyebrow: "sua linha é",
      title: "Festa",
      desc: "\"para usar na festa e fora dela\" — vestidos pra ocasiões especiais que você reutiliza depois, sem ficar parado no armário.",
      url: "https://unicloset.com.br/categoria-de-produto/festa/"
    },
    atelie: {
      eyebrow: "sua linha é",
      title: "Ateliê",
      desc: "\"para looks com personalidade\" — estampas e texturas que trazem seu jeito único pro guarda-roupa.",
      url: "https://unicloset.com.br/categoria-de-produto/atelie/"
    },
    acessorios: {
      eyebrow: "sua linha é",
      title: "Acessórios",
      desc: "\"transforme seus looks\" — cintos, semijoias e bijuterias que dão um novo ar em qualquer combinação.",
      url: "https://unicloset.com.br/categoria-de-produto/acessorios/"
    },
  };

  function scrollToBottom(){
    chatBody.scrollTop = chatBody.scrollHeight;
  }

  function addBotMessage(text){
    const el = document.createElement('div');
    el.className = 'msg bot';
    el.textContent = text;
    chatBody.appendChild(el);
    scrollToBottom();
  }

  function addUserMessage(text){
    const el = document.createElement('div');
    el.className = 'msg user';
    el.textContent = text;
    chatBody.appendChild(el);
    scrollToBottom();
  }

  function addLabel(text){
    const el = document.createElement('div');
    el.className = 'label';
    el.textContent = text;
    chatBody.appendChild(el);
    scrollToBottom();
  }

  function clearOptions(){
    document.querySelectorAll('.options, .label').forEach(el => el.remove());
  }

  const scores = { classicos: 0, festa: 0, atelie: 0, acessorios: 0 };
  const primaryPerAnswer = []; // só a tag principal de cada resposta, na ordem — usada no desempate
  const answerLabels = {}; // guarda o texto escolhido em cada pergunta, pra checar as exceções (OVERRIDES)
  let forcedResult = null; // se a pergunta 1 for "festa" ou "acessorios", o resultado já fica travado nessa linha

  function showStart(){
    addBotMessage("Oi! Responda 3 perguntas rápidas e eu te digo qual linha da Unicloset é perfeita para você.");
    addLabel("escolha uma opção ↓");
    const wrap = document.createElement('div');
    wrap.className = 'options';
    const btn = document.createElement('button');
    btn.className = 'opt';
    btn.innerHTML = '<span>Bora começar 😊</span><span class="chev">›</span>';
    btn.onclick = () => {
      wrap.remove();
      document.querySelector('.label')?.remove();
      askQ1();
    };
    wrap.appendChild(btn);
    chatBody.appendChild(wrap);
    scrollToBottom();
  }

  function renderOptions(question, onPick){
    setTimeout(() => {
      addBotMessage(question.text);
      const wrap = document.createElement('div');
      wrap.className = 'options';
      question.options.forEach(opt => {
        const btn = document.createElement('button');
        btn.className = 'opt';
        btn.innerHTML = `<span>${opt.label}</span><span class="chev">›</span>`;
        btn.onclick = () => {
          wrap.remove();
          addUserMessage(opt.label);
          onPick(opt);
        };
        wrap.appendChild(btn);
      });
      chatBody.appendChild(wrap);
      scrollToBottom();
    }, 350);
  }

  function registerAnswer(questionKey, opt){
    answerLabels[questionKey] = opt.label;
    opt.tags.forEach(tag => { scores[tag]++; });
    primaryPerAnswer.push(opt.tags[0]);
  }

  function askQ1(){
    renderOptions(Q1, (opt) => {
      registerAnswer('q1', opt);
      if(opt.tags[0] === 'festa' || opt.tags[0] === 'acessorios'){
        forcedResult = opt.tags[0]; // festa e acessórios já definem o resultado; as próximas perguntas são só experiência, não mudam o resultado
      }
      askQ2();
    });
  }

  function askQ2(){
    renderOptions(Q2, (opt) => {
      registerAnswer('q2', opt);
      askQ3();
    });
  }

  function askQ3(){
    renderOptions(Q3, (opt) => {
      registerAnswer('q3', opt);
      showResult();
    });
  }

  function showResult(){
    let winnerKey;
    if(forcedResult){
      winnerKey = forcedResult;
    } else {
      // Exceções — se bater com uma combinação exata de pergunta 2 + 3, ela decide.
      const override = OVERRIDES.find(o => o.q2 === answerLabels.q2 && o.q3 === answerLabels.q3);
      if(override){
        winnerKey = override.result;
      } else {
        const best = Math.max(...Object.values(scores));
        const tied = Object.keys(scores).filter(k => scores[k] === best);
        winnerKey = tied[0];
        for(let i = primaryPerAnswer.length - 1; i >= 0; i--){
          if(tied.includes(primaryPerAnswer[i])){ winnerKey = primaryPerAnswer[i]; break; }
        }
      }
    }
    showResultDirect(winnerKey);
  }

  function showResultDirect(key){
    const r = RESULTS[key];

    setTimeout(() => {
      addBotMessage("Prontinho! Com base no que você me contou, aqui está o que combina mais com você:");
      const card = document.createElement('div');
      card.className = 'result-card';
      card.innerHTML = `
        <div class="eyebrow">${r.eyebrow}</div>
        <div class="title">${r.title}</div>
        <div class="desc">${r.desc}</div>
      `;
      const link = document.createElement('a');
      link.className = 'result-cta';
      link.href = r.url;
      link.target = '_blank';
      link.rel = 'noopener';
      link.innerHTML = `<span>Ver a coleção ${r.title}</span><span>→</span>`;
      card.appendChild(link);
      chatBody.appendChild(card);

      const restartBtn = document.createElement('button');
      restartBtn.className = 'restart-btn';
      restartBtn.innerHTML = '↺ Refazer o questionário';
      restartBtn.onclick = restartQuiz;
      chatBody.appendChild(restartBtn);

      scrollToBottom();
    }, 350);
  }

  function restartQuiz(){
    Object.keys(scores).forEach(k => { scores[k] = 0; });
    primaryPerAnswer.length = 0;
    Object.keys(answerLabels).forEach(k => delete answerLabels[k]);
    forcedResult = null;
    chatBody.innerHTML = '';
    showStart();
  }

  showStart();
</script>

</body>
</html>
